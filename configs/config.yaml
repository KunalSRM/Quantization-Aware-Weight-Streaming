project:
  name: "Quantization-Aware Weight Streaming"
  seed: 42

model:
  default: "qwen_0_5b"

  registry:

    # =========================
    # QWEN FAMILY
    # =========================

    qwen_0_5b:
      family: "Qwen"
      name: "Qwen/Qwen2.5-0.5B-Instruct"
      size_b: 0.5
      tier: "safe"

    qwen_1_5b:
      family: "Qwen"
      name: "Qwen/Qwen2.5-1.5B-Instruct"
      size_b: 1.5
      tier: "safe"

    qwen_3b:
      family: "Qwen"
      name: "Qwen/Qwen2.5-3B-Instruct"
      size_b: 3.0
      tier: "experimental"

    # =========================
    # LLAMA FAMILY
    # =========================

    llama_1b:
      family: "Llama"
      name: "meta-llama/Llama-3.2-1B-Instruct"
      size_b: 1.0
      tier: "safe"

    llama_3b:
      family: "Llama"
      name: "meta-llama/Llama-3.2-3B-Instruct"
      size_b: 3.0
      tier: "experimental"

    # =========================
    # SMOLLM FAMILY
    # =========================

    smollm_135m:
      family: "SmolLM2"
      name: "HuggingFaceTB/SmolLM2-135M-Instruct"
      size_b: 0.135
      tier: "safe"

    smollm_360m:
      family: "SmolLM2"
      name: "HuggingFaceTB/SmolLM2-360M-Instruct"
      size_b: 0.36
      tier: "safe"

    smollm_1_7b:
      family: "SmolLM2"
      name: "HuggingFaceTB/SmolLM2-1.7B-Instruct"
      size_b: 1.7
      tier: "safe"

    # =========================
    # GEMMA FAMILY
    # =========================

    gemma_270m:
      family: "Gemma"
      name: "google/gemma-3-270m-it"
      size_b: 0.27
      tier: "safe"

    gemma_1b:
      family: "Gemma"
      name: "google/gemma-3-1b-it"
      size_b: 1.0
      tier: "safe"

    gemma_4b:
      family: "Gemma"
      name: "google/gemma-3-4b-it"
      size_b: 4.0
      tier: "experimental"


hardware:
  device: "cuda"
  allow_cpu_fallback: false


quantization:
  supported_bits: [8, 4, 3, 2]
  default_bits: 4


streaming:
  enabled: true


benchmark:
  warmup_runs: 1
  runs: 1
  max_new_tokens: 64
  prompt: "Explain how CPU to GPU weight streaming can reduce GPU memory pressure during LLM inference."


mpi:
  enabled: true
  default_ranks: 2


experiments:
  default_mode: "single"